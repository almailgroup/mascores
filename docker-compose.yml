version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mascores-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mascores
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-stub:
    image: node:18-alpine
    container_name: mascores-api
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mascores"
      ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hc2NvcmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTI0OTk0MzIsImV4cCI6MTg1MDI2NTQzMn0.mascores-test-key-do-not-use-in-production"
      SERVICE_ROLE_KEY: "mascores-service-role-key-do-not-use-in-production"
    volumes:
      - ./scripts/api-stub.js:/app/index.js
    command: node index.js
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    name: mascores-network
