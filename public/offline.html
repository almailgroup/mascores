<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1628" />
<title>Offline — MansourAlmailScores</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0a1628; color: #e8eefb; text-align: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 22rem; }
  img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; }
  h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; font-size: 0.9rem; line-height: 1.5; color: #9fb0cc; }
  button {
    font: inherit; font-weight: 600; font-size: 0.875rem; cursor: pointer;
    border: 0; border-radius: 999px; padding: 12px 28px;
    background: #2563eb; color: #fff;
  }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>We can't reach the scores right now. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
